# =============================================================================
# PIA Starter Stack
# =============================================================================
# Deployment assumption: this compose runs BEHIND a Pangolin / Newt tunnel.
# Newt connects out to a Pangolin instance and forwards traffic to backend
# services BY DOCKER SERVICE NAME on the shared `pia-stack` network. None of
# the backend services bind host ports — Newt is the only path in.
#
# For local testing without Pangolin, run curl from inside the network, e.g.:
#   docker run --rm --network pia-stack curlimages/curl:latest -sI http://listmonk:9000/
#
# Default profile starts: newt, mkdocs (dev), mkdocs-site-server (static),
#                         listmonk-db, listmonk, code-server
# `--profile session` adds: cryptpad
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Newt — Pangolin tunnel client
  # Docs: https://docs.pangolin.net/  ·  https://github.com/fosrl/newt
  #
  # Connects out to a Pangolin instance and forwards traffic to backend
  # services on the `pia-stack` network by docker service name (e.g.
  # `listmonk:9000`, `cryptpad:3000`). No host port binding — Pangolin
  # resources target the docker service names directly.
  #
  # Required env (get NEWT_ID / NEWT_SECRET by registering this host as a
  # "site" in your Pangolin admin UI, type "newt"):
  #   PANGOLIN_ENDPOINT, PANGOLIN_NEWT_ID, PANGOLIN_NEWT_SECRET
  #
  # Forks that use a different tunnel (Cloudflared, Tailscale Funnel) can
  # comment this service out — the rest of the stack is tunnel-agnostic.
  # ---------------------------------------------------------------------------
  newt:
    image: fosrl/newt:latest
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${PANGOLIN_NEWT_ID}
      - NEWT_SECRET=${PANGOLIN_NEWT_SECRET}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MkDocs Material — DEV server (hot-reload)
  # Docs: https://squidfunk.github.io/mkdocs-material/  ·  https://www.mkdocs.org/
  # Replaces: Squarespace, Notion-public, a half-built WordPress site.
  # Edit ./docs/*.md, save, refresh — the site rebuilds automatically.
  # Use this during the live session: pasting research files into ./docs/
  # shows up on the public URL within seconds with no extra build step.
  #
  # Reachable on the network as `mkdocs:8000`.
  # ---------------------------------------------------------------------------
  mkdocs:
    image: squidfunk/mkdocs-material:latest
    # Run as the same UID/GID as code-server (and as nginx-static-server's
    # PUID/PGID). All three touch ./site/ — keeping them on a single UID
    # means no permission tangles between `docker compose run --rm mkdocs
    # build` (this service) and `mkdocs build` from code-server's terminal.
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    working_dir: /docs
    # Image ENTRYPOINT is `mkdocs`; pass the subcommand only.
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    expose:
      - "8000"
    volumes:
      # Mount the WHOLE project root at /docs — mkdocs expects mkdocs.yml,
      # docs/, and site/ under its working dir, which already matches the
      # project layout. A directory mount avoids the single-file stale-inode
      # bug (atomic-write edits to mkdocs.yml would otherwise leave the dev
      # server serving the old version until restart). The site/ subdir is
      # the build output and is shared with mkdocs-site-server which serves
      # the built static files.
      - .:/docs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MkDocs built site — Nginx static server (production serve)
  # Docs: https://docs.linuxserver.io/images/docker-nginx/  ·  https://nginx.org/en/docs/
  # Serves the output of `mkdocs build` (./site/) as plain static files.
  # Faster, leaner, and survives the Python process dying — but does NOT
  # auto-rebuild on content changes. Run `docker compose run --rm mkdocs \
  # mkdocs build` after editing.
  #
  # Pick one for public exposure: the dev `mkdocs` service above OR this one.
  # Running both at the same upstream domain will fight over routing.
  #
  # Reachable on the network as `mkdocs-site-server:80`.
  # ---------------------------------------------------------------------------
  mkdocs-site-server:
    image: lscr.io/linuxserver/nginx:1.28.2
    environment:
      - PUID=${USER_ID:-1000}
      - PGID=${GROUP_ID:-1000}
      - TZ=${TZ:-Etc/UTC}
    expose:
      - "80"
    volumes:
      - ./site:/config/www
      - ./configs/mkdocs-site/default.conf:/config/nginx/site-confs/default.conf:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # CryptPad — collaborative pad (OPTIONAL — session infrastructure only)
  # Docs: https://docs.cryptpad.org/  ·  https://github.com/cryptpad/cryptpad
  # Replaces: Google Docs / Etherpad-as-SaaS.
  #
  # Behind the `session` profile because most forks of this stack don't need
  # CryptPad — it's the live-writing surface for the PIA workshop, not a
  # service an advocacy org runs day-to-day. Bring it up with:
  #     docker compose --profile session up -d
  #
  # Needs TWO Pangolin resources: a "main" origin (pad.*) and a "sandbox"
  # origin (pad-sandbox.*). Both target `cryptpad:3000` — sandbox separation
  # is enforced by Host header. The WebSocket path on the main domain
  # (/cryptpad_websocket) needs a Pangolin path-rule targeting `cryptpad:3003`.
  # ---------------------------------------------------------------------------
  cryptpad:
    profiles: ["session"]
    image: cryptpad/cryptpad:version-2026.2.2
    hostname: cryptpad
    environment:
      - CPAD_MAIN_DOMAIN=${CRYPTPAD_MAIN_DOMAIN:-http://localhost}
      - CPAD_SANDBOX_DOMAIN=${CRYPTPAD_SANDBOX_DOMAIN:-http://localhost}
      - CPAD_CONF=/cryptpad/config/config.js
    expose:
      - "3000"
      - "3003"
    volumes:
      # Custom config.js — overrides the dev-flavored one shipped in the image
      # (which hardcodes httpAddress: 'localhost', breaking inter-container
      # reachability) and reads URLs from CPAD_MAIN_DOMAIN/CPAD_SANDBOX_DOMAIN.
      - ./configs/cryptpad/config.js:/cryptpad/config/config.js:ro
      - ./data/cryptpad/blob:/cryptpad/blob
      - ./data/cryptpad/block:/cryptpad/block
      - ./data/cryptpad/data:/cryptpad/data
      - ./data/cryptpad/files:/cryptpad/datastore
      - ./data/cryptpad/customize:/cryptpad/customize
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Listmonk — mass email / newsletter management
  # Docs: https://listmonk.app/docs/  ·  Postgres: https://www.postgresql.org/docs/17/
  # Replaces: Mailchimp, Constant Contact
  # Reachable on the network as `listmonk:9000`.
  # ---------------------------------------------------------------------------
  listmonk-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${LISTMONK_DB_USER:-listmonk}
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-listmonk}
      POSTGRES_DB: ${LISTMONK_DB_NAME:-listmonk}
    volumes:
      - listmonk-db:/var/lib/postgresql/data
    restart: unless-stopped

  listmonk:
    image: listmonk/listmonk:latest
    expose:
      - "9000"
    depends_on:
      - listmonk-db
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__user: ${LISTMONK_DB_USER:-listmonk}
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-listmonk}
      LISTMONK_db__database: ${LISTMONK_DB_NAME:-listmonk}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Answer — Q&A / community knowledge base
  # Docs: https://answer.apache.org/docs/  ·  https://github.com/apache/answer
  # Replaces: Stack Overflow Teams, Zendesk Guide, a half-built FAQ page.
  #
  # A self-hosted Q&A platform (think open-membership Stack Overflow). Useful
  # for member questions, public "ask us anything" pages, and shareable FAQs
  # that grow with the campaign rather than rotting in a Google Doc.
  #
  # First-boot is a browser wizard at /install — set the admin account, pick
  # SQLite (default, no extra service) or point at MySQL/Postgres, and go.
  # Persistent state (SQLite DB + uploaded images) lives in the answer-data
  # named volume; back it up alongside listmonk-db.
  #
  # Reachable on the network as `answer:80`.
  # ---------------------------------------------------------------------------
  answer:
    image: apache/answer:latest
    expose:
      - "80"
    volumes:
      - answer-data:/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Homepage — service dashboard / landing page
  # Docs: https://gethomepage.dev/  ·  https://github.com/gethomepage/homepage
  # Replaces: hand-rolled HTML index, "where do I log in to ___?" Slack threads.
  #
  # gethomepage.dev — a configurable dashboard that lists your services,
  # widgets (uptime, weather, etc.), and bookmarks. Useful as the public
  # front door of a stack (point `lander.example.org` here) so members and
  # staff can find every tool without memorizing subdomains.
  #
  # Config lives in /app/config (named volume `homepage-data`). On first
  # boot Homepage seeds default YAML files there — edit `services.yaml`,
  # `bookmarks.yaml`, etc. via code-server or directly in the volume.
  #
  # HOMEPAGE_ALLOWED_HOSTS (Homepage v1+ requirement): comma-separated list
  # of public hostnames the dashboard will serve. `*` allows any host —
  # convenient default but tighten in production by listing your real
  # subdomain(s), e.g. `HOMEPAGE_ALLOWED_HOSTS=lander.example.org`.
  #
  # Reachable on the network as `homepage:3000`.
  # ---------------------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    expose:
      - "3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-*}
    volumes:
      # Version-controlled config — services/settings/bookmarks/widgets/docker
      # YAML files plus custom.css. Edit on the host and re-run `docker compose
      # up -d homepage` to pick up changes (the container watches /app/config
      # so most edits hot-reload without a restart).
      - ./configs/homepage:/app/config
      # Docker socket (read-only) — lets Homepage fetch CPU / memory / uptime
      # for any service whose entry sets `server: my-docker`. The matching
      # `my-docker` definition lives in configs/homepage/docker.yaml.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Code Server — web IDE (admin / build convenience)
  # Docs: https://coder.com/docs/code-server/latest  ·  https://docs.linuxserver.io/images/docker-code-server/
  # Lets you edit ./docs/*.md, edit mkdocs.yml, and run `mkdocs build` from a
  # browser instead of SSH + terminal. Useful for the session climax: paste,
  # save, click Terminal → `mkdocs build`, refresh pia2026.* on the projector.
  #
  # SECURITY: code-server provides shell access via a browser. Reachable on
  # 127.0.0.1:8899 by default (use SSH tunnel for remote access). DO NOT
  # publish via Pangolin without a strong password and ideally behind an
  # IP allowlist or Pangolin auth resource.
  #
  # PANGOLIN ROUTE: point a Pangolin resource at `code-server:8443` (docker
  # service name + internal port). Newt joins `pia-stack` and reaches the
  # service directly — no host port needed for the Pangolin path.
  #
  # IMAGE: linuxserver-based by default (honors PUID/PGID/DEFAULT_WORKSPACE,
  # listens on :8443). PIA's deployment overrides to the BNKops prebuilt image
  # (same lineage; adds mkdocs + plugins + claude-code preinstalled):
  #     CODE_SERVER_IMAGE=gitea.bnkops.com/admin/code-server:latest
  # On the public `lscr.io/linuxserver/code-server` default, install mkdocs in
  # the workspace terminal once:
  #     pip install --user "mkdocs-material[recommended]"
  # ---------------------------------------------------------------------------
  code-server:
    image: ${CODE_SERVER_IMAGE:-lscr.io/linuxserver/code-server:latest}
    environment:
      - PUID=${USER_ID:-1000}
      - PGID=${GROUP_ID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - DEFAULT_WORKSPACE=/config/workspace
      - PASSWORD=${CODE_SERVER_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8899}:8443"
    volumes:
      # Code-server state (settings, extensions, terminal history). The
      # linuxserver image bind-mounts /config; workspace lives under it.
      - ./data/code-server:/config
      # Mount the WHOLE project as the IDE workspace. A directory bind mount
      # is robust against the stale-inode bug that bites single-file mounts:
      # editors that atomic-write-and-rename (Claude's Edit tool, vim with
      # `set backupcopy=auto`, most VS Code saves) replace the host inode,
      # but a single-file bind mount stays pinned to the original. Whole-
      # directory mounts re-resolve filenames each access, so they always
      # see fresh content.
      - .:/config/workspace
      # Shadow ./.env (secrets) and ./data/ (runtime state) so they don't
      # appear in the IDE. /dev/null bind-mount makes .env look like an
      # empty file inside the container; tmpfs hides data/ behind an empty
      # in-memory directory.
      - /dev/null:/config/workspace/.env
      # linuxserver init hook — scripts run as root before code-server starts.
      # install-mkdocs.sh self-heals /config/.venv on every start (apt-installs
      # python3 if missing; rebuilds the venv if the image's system Python
      # changed paths). Without this, `mkdocs build` in the IDE terminal
      # breaks any time the upstream image is rebuilt.
      - ./configs/code-server/init.d:/custom-cont-init.d:ro
      # Parent-vault scripts/ (pangolin-push.py and friends) accessible from
      # the IDE workspace. The PIA deployment keeps operational tooling in
      # ../scripts/ alongside session materials; this line lets the presenter
      # run those scripts from code-server's terminal during the session.
      # FORKERS: if you don't have a sibling scripts/ directory, delete this
      # line — Docker will create an empty host dir if the path is missing,
      # which is harmless but clutters your tree.
      - ../scripts:/config/workspace/scripts
      # Docker socket — lets `docker` / `docker compose` commands run from the
      # IDE terminal and from Claude Code inside code-server. Requires the
      # Docker CLI to be present in the container: the BNKops image includes
      # it; on the stock linuxserver image add an init.d script to install it.
      # SECURITY: grants full Docker access on the host from the browser IDE.
      # Only expose code-server behind Pangolin auth or an IP allowlist.
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /config/workspace/data
    restart: unless-stopped

# Single named network — every service joins by default. Naming it explicitly
# (rather than letting compose auto-create `<project>_default`) makes the
# `docker run --rm --network pia-stack ...` test pattern stable across hosts.
networks:
  default:
    name: pia-stack
    driver: bridge

volumes:
  listmonk-db:
  answer-data:
